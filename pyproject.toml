[tool.poetry]
requires-poetry = "==2.3.3"
name = "reciprocal-robin"
version = "1.0.0"
description = "Proof verification and numerical tools for reciprocal LCM-power Robin problems"
authors = ["Grant Molnar"]
license = "MIT"
readme = "README.md"
packages = [{ include = "reciprocal_robin", from = "src" }]
repository = "https://github.com/grantmolnar/reciprocal-robin"
include = [
    { path = "ARCHITECTURE.md", format = "sdist" },
    { path = "CHANGELOG.md", format = "sdist" },
    { path = "CERTIFICATION.md", format = "sdist" },
    { path = "CONTRIBUTING.md", format = "sdist" },
    { path = "CITATION.cff", format = "sdist" },
    { path = "LICENSE", format = "sdist" },
    { path = "PROOF_MANIFEST.json", format = "sdist" },
    { path = "data", format = "sdist" },
    { path = "examples", format = "sdist" },
    { path = "poetry.lock", format = "sdist" },
    { path = "requirements-verification.txt", format = "sdist" },
    { path = "scripts", format = "sdist" },
    { path = "tests", format = "sdist" },
]

[tool.poetry.dependencies]
python = "^3.11"
mpmath = "^1.3"
sympy = "^1.13"

[tool.poetry.group.dev.dependencies]
pytest = "^8.0"
pytest-xdist = "^3.5"
ruff = "^0.6"
mypy = "^1.11"
hypothesis = "^6.100"

[tool.poetry.scripts]
reciprocal-robin = "reciprocal_robin.cli:main"
reciprocal-robin-certify-bounded = "reciprocal_robin.certification.bounded_generate:main"
reciprocal-robin-verify-bounded = "reciprocal_robin.certification.bounded_verify:main"
reciprocal-robin-sweep-bounded = "reciprocal_robin.certification.sweep:main"
reciprocal-robin-certify-kappa-five = "reciprocal_robin.certification.kappa_five_generate:main"
reciprocal-robin-verify-kappa-five = "reciprocal_robin.certification.kappa_five_verify:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = [
    "stress: slower randomized or high-volume verification tests",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.mypy]
python_version = "3.11"
strict = true
exclude = ["^tests/"]

[build-system]
requires = ["poetry-core==2.3.2"]
build-backend = "poetry.core.masonry.api"

[[tool.mypy.overrides]]
module = ["mpmath", "sympy"]
ignore_missing_imports = true
